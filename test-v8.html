<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وِرد v8 — إصدار المصحف الكامل</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; background-color: #0E1726; color: #EFE7D5; font-family: sans-serif; }
        #root { min-height: 100vh; }
        .boot { display: grid; place-items: center; height: 100vh; font-size: 20px; }
    </style>
</head>
<body>
    <div id="root"><div class="boot">جاري تشغيل المحرك v8...</div></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        /* --- البيانات والحدود --- */
        const SURAH_NAMES = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
        const AYAH_COUNTS = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
        const JUZ_STARTS = [[1,1],[2,142],[2,253],[3,93],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],[9,93],[11,6],[12,53],[15,1],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]];
        const RIWAYAT = [
            { id: 'hafs', name: 'حفص عن عاصم', mushaf: 'مصحف المدينة' },
            { id: 'warsh', name: 'ورش عن نافع', mushaf: 'مصحف الشمرلي' }
        ];

        /* --- الأدوات --- */
        const ar = (n) => String(n);
        const getTodayLocal = () => {
            const d = new Date();
            const offset = d.getTimezoneOffset() * 60000;
            return new Date(d.getTime() - offset).toISOString().slice(0, 10);
        };
        const addDays = (s, n) => {
            const d = new Date(s + "T00:00:00Z");
            d.setUTCDate(d.getUTCDate() + n);
            return d.toISOString().slice(0, 10);
        };
        const diffDays = (a, b) => Math.floor((Date.parse(a + "T00:00:00Z") - Date.parse(b + "T00:00:00Z")) / 86400000);
        const weekdayOf = (ds) => new Date(ds + "T00:00:00Z").getUTCDay();

        /* --- خوارزمية التقسيم --- */
        function generatePlan(p, ranges) {
            const tasks = []; let ayahIdx = 0; let curDate = p.startDate; const total = ranges.length;
            const countW = (s, e, sch) => { let c = 0, d = s; while (diffDays(e, d) >= 0) { if (sch[weekdayOf(d)] === 'mem') c++; d = addDays(d, 1); } return c; };
            const workTotal = (p.mode === 'date') ? countW(p.startDate, p.targetEndDate, p.schedule) : 0;
            let workC = 0;
            while (ayahIdx < total && tasks.length < 3000) {
                const type = p.schedule[weekdayOf(curDate)];
                if (type === 'mem') {
                    workC++;
                    let amt = p.mode === 'date' ? Math.ceil((total - ayahIdx) / Math.max(1, workTotal - workC + 1)) : p.dailyAmount;
                    const st = ranges[ayahIdx]; const enIdx = Math.min(total - 1, ayahIdx + amt - 1); const en = ranges[enIdx];
                    tasks.push({ id: Math.random().toString(36).slice(2,9), date: curDate, type: 'MEM', s1: st.s, a1: st.a, s2: en.s, a2: en.a, status: 'PENDING' });
                    ayahIdx = enIdx + 1;
                } else if (type === 'rev') tasks.push({ id: Math.random().toString(36).slice(2,9), date: curDate, type: 'REV_GENERAL', status: 'PENDING' });
                curDate = addDays(curDate, 1);
            }
            return tasks;
        }

        /* --- المكونات --- */
        function Wizard({ onComplete }) {
            const [step, setStep] = useState(1);
            const [form, setForm] = useState({
                riwayahId: 'hafs', goalType: 'JUZ_RANGE', startJuz: 30, endJuz: 30,
                startSurah: 78, startAyah: 1, endSurah: 114, endAyah: 6,
                startDate: getTodayLocal(), targetEndDate: addDays(getTodayLocal(), 30), mode: 'date', dailyAmount: 5,
                schedule: { 0: 'rev', 1: 'mem', 2: 'mem', 3: 'mem', 4: 'mem', 5: 'mem', 6: 'rev' }
            });
            return (
                <div className="wizard card">
                    <div className="header"><h2>الخطوة {ar(step)} من 4</h2></div>
                    <div className="step-content">
                        {step === 1 && <select value={form.riwayahId} onChange={e=>setForm({...form, riwayahId:e.target.value})}>{RIWAYAT.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select>}
                        {step === 2 && ['FULL_QURAN','JUZ_RANGE','AYAH_RANGE'].map(t => <button key={t} className={form.goalType===t?'opt on':'opt'} onClick={()=>setForm({...form, goalType:t})}>{t==='FULL_QURAN'?'القرآن كاملاً':t==='JUZ_RANGE'?'بالأجزاء':'نطاق آيات'}</button>)}
                        {step === 3 && <>
                            <input type="date" value={form.startDate} onChange={e=>setForm({...form, startDate:e.target.value})} />
                            <div className="schedule-grid">{[0,1,2,3,4,5,6].map(i=><button key={i} className={`day-btn ${form.schedule[i]}`} onClick={()=>{const n={mem:'rev',rev:'rest',rest:'mem'}[form.schedule[i]];setForm({...form, schedule:{...form.schedule,[i]:n}});}}>{{0:'ح',1:'ن',2:'ث',3:'ر',4:'خ',5:'ج',6:'س'}[i]}</button>)}</div>
                        </>}
                        {step === 4 && <div className="preview">خطة {RIWAYAT.find(r=>r.id===form.riwayahId).name}</div>}
                    </div>
                    <div className="footer">
                        {step>1 && <button className="btn ghost" onClick={()=>setStep(s=>s-1)}>السابق</button>}
                        <button className="btn primary" onClick={step<4?()=>setStep(s=>s+1):()=>{
                            let s1,a1,s2,a2;
                            if(form.goalType==='FULL_QURAN') [s1,a1,s2,a2]=[1,1,114,6];
                            else if(form.goalType==='JUZ_RANGE'){ [s1,a1]=JUZ_STARTS[form.startJuz-1]; const en=form.endJuz===30?[114,7]:JUZ_STARTS[form.endJuz]; [s2,a2]=en[1]>1?[en[0],en[1]-1]:[en[0]-1,AYAH_COUNTS[en[0]-2]]; }
                            else [s1,a1,s2,a2]=[form.startSurah,form.startAyah,form.endSurah,form.endAyah];
                            const ranges = []; for(let s=s1;s<=s2;s++){ const f=s===s1?a1:1; const l=s===s2?a2:AYAH_COUNTS[s-1]; for(let a=f;a<=l;a++) ranges.push({s,a}); }
                            onComplete({...form, tasks: generatePlan(form, ranges), totalAyahs: ranges.length});
                        }}>{step<4?'التالي':'تأكيد'}</button>
                    </div>
                </div>
            );
        }

        function App() {
            const [st, setSt] = useState(null);
            const [tab, setTab] = useState("home");
            useEffect(() => { try { const s = localStorage.getItem("wird_v8"); setSt(s?JSON.parse(s):{plan:null, units:[], streak:0}); } catch { setSt({plan:null, units:[], streak:0}); } }, []);
            useEffect(() => { if(st) localStorage.setItem("wird_v8", JSON.stringify(st)); }, [st]);
            if(!st) return null;
            const localToday = getTodayLocal();
            const todayTasks = st.plan ? st.plan.tasks.filter(t => t.date <= localToday && t.status === 'PENDING') : [];
            const reviewDue = st.units.filter(u => u.nextReview <= localToday);
            const progress = st.plan ? Math.round((st.plan.tasks.filter(t=>t.status==='DONE'&&t.type==='MEM').length / st.plan.tasks.filter(t=>t.type==='MEM').length) * 100) : 0;

            const handleComplete = (task, rating) => {
                setSt(s => {
                    const tasks = s.plan.tasks.map(t => t.id === task.id ? {...t, status:'DONE'}:t);
                    let units = [...s.units];
                    if(task.type==='MEM') units.push({...task, id:'u'+Date.now(), nextReview: addDays(localToday, rating===4?3:1)});
                    return {...s, streak: s.streak+1, units, plan:{...s.plan, tasks}, lastActivity: localToday};
                });
            };

            return (
                <div className="app" dir="rtl">
                    <style>{CSS}</style>
                    <header className="topbar"><h1>وِرد v8</h1><div className="badge"><b>{ar(st.streak)}</b><span>يوم</span></div></header>
                    {!st.plan ? <Wizard onComplete={p=>setSt({...st, plan:p})} /> : (
                        <div className="screen">
                            <div className="card"><h3>إنجاز الحفظ: {ar(progress)}%</h3><div className="p-bar"><i style={{width: progress+'%'}} /></div></div>
                            <div className="task-list">
                                {reviewDue.map((u,i) => <div key={'r'+i} className="task-card REV"><div>مراجعة: {SURAH_NAMES[u.s1-1]}</div><button onClick={()=>setSt(s=>({...s, units:s.units.map(x=>x.id===u.id?{...x,nextReview:addDays(localToday,7)}:x)}))}>تم</button></div>)}
                                {todayTasks.map(t => <div key={t.id} className="task-card"><div>{t.type==='MEM'?`${SURAH_NAMES[t.s1-1]} (${ar(t.a1)}-${ar(t.a2)})`:'تثبيت'}</div><button onClick={()=>handleComplete(t, 4)}>ممتاز</button></div>)}
                            </div>
                            <nav className="bottomnav"><button onClick={()=>{localStorage.clear();location.reload();}}>إعادة الخطة</button></nav>
                        </div>
                    )}
                </div>
            );
        }

        const CSS = `
            body{ --bg:#0E1726; --surface:#152139; --primary:#C9A227; --text:#EFE7D5; background:var(--bg); color:var(--text); padding-bottom:60px; }
            .topbar{ display:flex; justify-content:space-between; padding:20px; align-items:center; }
            .badge{ background:#1D2E4B; padding:5px 15px; border-radius:15px; border:1px solid var(--primary); text-align:center; }
            .card{ background:var(--surface); border-radius:20px; padding:20px; margin:15px; border:1px solid rgba(201,162,39,0.1); }
            .wizard{ max-width:450px; margin:20px auto; }
            .step-content{ margin:20px 0; display:flex; flex-direction:column; gap:10px; }
            select, input{ background:var(--bg); color:white; padding:12px; border:1px solid #1D2E4B; border-radius:10px; }
            .btn{ border:none; padding:12px 20px; border-radius:10px; cursor:pointer; font-weight:bold; }
            .btn.primary{ background:var(--primary); }
            .btn.ghost{ background:none; color:white; border:1px solid #1D2E4B; }
            .opt{ background:#1D2E4B; color:white; padding:15px; border-radius:12px; text-align:right; border:1px solid transparent; width:100%; cursor:pointer; }
            .opt.on{ border-color:var(--primary); background:rgba(201,162,39,0.1); }
            .schedule-grid{ display:flex; gap:5px; }
            .day-btn{ flex:1; height:40px; border-radius:10px; border:none; color:white; font-weight:bold; cursor:pointer; }
            .day-btn.mem{ background:#3F8F7E; } .day-btn.rev{ background:#5B8FC7; } .day-btn.rest{ background:#3B4554; }
            .task-card{ background:var(--surface); padding:15px; border-radius:15px; margin:10px; display:flex; justify-content:space-between; border-right:4px solid var(--primary); }
            .task-card.REV{ border-right-color:#5B8FC7; }
            .p-bar{ height:6px; background:#1D2E4B; border-radius:3px; margin:10px 0; overflow:hidden; }
            .p-bar i{ display:block; height:100%; background:var(--primary); transition:0.3s; }
            .bottomnav{ position:fixed; bottom:0; left:0; right:0; background:var(--surface); padding:15px; text-align:center; }
        `;
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
