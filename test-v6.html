<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وِرد v6 — النظام المتكامل</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; background-color: #0E1726; color: #EFE7D5; font-family: sans-serif; }
        #root { min-height: 100vh; }
        .boot { display: grid; place-items: center; height: 100vh; font-size: 20px; }
    </style>
</head>
<body>
    <div id="root"><div class="boot">جاري تحميل المحرك v6...</div></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        /* --- البيانات والحدود --- */
        const SURAH_NAMES = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
        const AYAH_COUNTS = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
        const JUZ_STARTS = [[1,1],[2,142],[2,253],[3,93],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],[9,93],[11,6],[12,53],[15,1],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]];
        const HIZB_STARTS = [[1,1],[2,75],[2,142],[2,203],[2,253],[3,15],[3,93],[3,171],[4,24],[4,88],[4,148],[5,27],[5,82],[6,36],[6,111],[7,1],[7,88],[7,171],[8,41],[9,34],[9,93],[10,26],[11,6],[11,84],[12,53],[13,19],[15,1],[16,51],[17,1],[17,100],[18,75],[19,59],[21,1],[22,38],[23,1],[24,21],[25,21],[26,111],[27,56],[29,1],[29,46],[31,22],[33,31],[34,24],[36,28],[38,21],[39,32],[40,41],[41,47],[43,24],[46,1],[48,18],[51,31],[54,9],[58,1],[61,1],[67,1],[72,1],[78,1],[87,1]];
        const RIWAYAT = [{id:'hafs',name:'حفص عن عاصم'},{id:'warsh',name:'ورش عن نافع'}];

        const ar = (n) => String(n);
        const today = () => new Date().toISOString().slice(0, 10);
        const addDays = (s, n) => new Date((Math.floor(Date.parse(s + "T00:00:00Z") / 86400000) + n) * 86400000).toISOString().slice(0, 10);
        const diffDays = (a, b) => Math.floor((Date.parse(a + "T00:00:00Z") - Date.parse(b + "T00:00:00Z")) / 86400000);
        const weekdayOf = (ds) => new Date(ds + "T00:00:00Z").getUTCDay();

        /* --- المحركات --- */
        const QuranGoalResolutionService = {
            getAyahRange(startSurah, startAyah, endSurah, endAyah) {
                const ranges = [];
                for (let s = startSurah; s <= endSurah; s++) {
                    const first = (s === startSurah) ? startAyah : 1;
                    const last = (s === endSurah) ? endAyah : AYAH_COUNTS[s - 1];
                    for (let a = first; a <= last; a++) ranges.push({ s, a });
                }
                return ranges;
            },
            resolve(form) {
                let startS, startA, endS, endA;
                if (form.goalType==='FULL_QURAN') [startS,startA,endS,endA] = [1,1,114,6];
                else if (form.goalType==='JUZ_RANGE') {
                    [startS,startA] = JUZ_STARTS[form.startJuz-1];
                    const je = form.endJuz===30?[114,6]:JUZ_STARTS[form.endJuz];
                    [endS,endA] = (je[1]>1)?[je[0],je[1]-1]:[je[0]-1,AYAH_COUNTS[je[0]-2]];
                }
                else if (form.goalType==='AYAH_RANGE') [startS,startA,endS,endA] = [form.startSurah,form.startAyah,form.endSurah,form.endAyah];
                return { startS, startA, endS, endA };
            }
        };

        function generateTasks(p, ranges) {
            const tasks = []; let ayahIdx = 0; let curD = p.startDate;
            while(ayahIdx < ranges.length && tasks.length < 1000) {
                const type = p.schedule[weekdayOf(curD)];
                if(type === 'mem') {
                    let amt = p.mode==='date'?Math.ceil((ranges.length-ayahIdx)/Math.max(1,diffDays(p.targetEndDate,curD))):p.dailyAmount;
                    const st = ranges[ayahIdx]; const enIdx = Math.min(ranges.length-1, ayahIdx+amt-1); const en = ranges[enIdx];
                    tasks.push({date:curD, type:'NEW_MEMORIZATION', startS:st.s, startA:st.a, endS:en.s, endA:en.a, status:'PENDING'});
                    ayahIdx = enIdx+1;
                } else if(type==='rev') tasks.push({date:curD, type:'RECENT_REVISION', status:'PENDING'});
                curD = addDays(curD, 1);
            }
            return tasks;
        }

        /* --- المكونات --- */
        function PlanWizardV6({ onComplete }) {
            const [step, setStep] = useState(1);
            const [form, setForm] = useState({
                riwayahId: 'hafs', goalType: 'JUZ_RANGE', startJuz: 30, endJuz: 30,
                startSurah: 78, startAyah: 1, endSurah: 114, endAyah: 6,
                startDate: today(), targetEndDate: addDays(today(), 30), mode: 'date', dailyAmount: 5,
                schedule: { 0: 'rev', 1: 'mem', 2: 'mem', 3: 'mem', 4: 'mem', 5: 'mem', 6: 'rev' }
            });
            const vError = (step===3 && form.goalType==='JUZ_RANGE' && form.endJuz < form.startJuz) ? "نهاية النطاق تسبق بدايته" : null;
            return (
                <div className="wizard card">
                    <div className="header"><span>الخطوة {ar(step)} من 5</span><h2>{step===1?'الرواية':step===2?'الهدف':step===3?'النطاق':step===4?'الخطة':'التأكيد'}</h2></div>
                    <div className="step-content">
                        {step===1 && <select value={form.riwayahId} onChange={e=>setForm({...form, riwayahId:e.target.value})}>{RIWAYAT.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select>}
                        {step===2 && ['FULL_QURAN','JUZ_RANGE','AYAH_RANGE'].map(t=><button key={t} className={form.goalType===t?'opt active':'opt'} onClick={()=>setForm({...form, goalType:t})}>{t==='FULL_QURAN'?'المصحف كاملاً':t==='JUZ_RANGE'?'بالأجزاء':'بالآيات'}</button>)}
                        {step===3 && form.goalType==='JUZ_RANGE' && <div className="row"><select value={form.startJuz} onChange={e=>setForm({...form, startJuz:+e.target.value})}>{Array.from({length:30},(_,i)=><option key={i+1} value={i+1}>جزء {ar(i+1)}</option>)}</select><select value={form.endJuz} onChange={e=>setForm({...form, endJuz:+e.target.value})}>{Array.from({length:30},(_,i)=><option key={i+1} value={i+1}>إلى جزء {ar(i+1)}</option>)}</select></div>}
                        {step===4 && <input type="date" value={form.targetEndDate} onChange={e=>setForm({...form, targetEndDate:e.target.value})} />}
                        {step===5 && <div className="preview">خطة {RIWAYAT.find(r=>r.id===form.riwayahId).name}</div>}
                    </div>
                    {vError && <div className="error">{vError}</div>}
                    <div className="footer">
                        {step>1 && <button className="btn ghost" onClick={()=>setStep(s=>s-1)}>السابق</button>}
                        <button className="btn primary" disabled={!!vError} onClick={step<5?()=>setStep(s=>s+1):()=>{const r = QuranGoalResolutionService.resolve(form); onComplete({...form, ...r, tasks:generateTasks(form, QuranGoalResolutionService.getAyahRange(r.startS,r.startA,r.endS,r.endA))})}}>{step<5?'التالي':'إنشاء الخطة'}</button>
                    </div>
                </div>
            );
        }

        function App() {
            const [st, setSt] = useState(null);
            const [tab, setTab] = useState("home");
            useEffect(() => { const saved = localStorage.getItem("wird_v6"); setSt(saved?JSON.parse(saved):{plan:null, streak:0, units:[]}); }, []);
            useEffect(() => { if(st) localStorage.setItem("wird_v6", JSON.stringify(st)); }, [st]);
            if(!st) return null;
            const todayT = st.plan?st.plan.tasks.filter(t=>t.date===today()&&t.status==='PENDING'):[];
            const done = st.plan?Math.round((st.plan.tasks.filter(t=>t.status==='COMPLETED').length/st.plan.tasks.length)*100):0;
            return (
                <div className="app" dir="rtl">
                    <style>{CSS}</style>
                    <header className="topbar"><h1>وِرد v6</h1><div className="badge"><b>{ar(st.streak)}</b><span>يوم</span></div></header>
                    {!st.plan ? <PlanWizardV6 onComplete={p=>setSt({...st, plan:p})} /> : (
                        <div className="screen">
                            {tab==='home' && <>
                                <div className="card"><h3>إنجاز الخطة: {ar(done)}%</h3><div className="p-bar"><i style={{width:done+'%'}} /></div></div>
                                {todayT.map((t,i)=><div key={i} className="task-card"><div>{t.type==='NEW_MEMORIZATION'?`${SURAH_NAMES[t.startS-1]} (${ar(t.startA)}-${ar(t.endA)})`:'مراجعة'}</div><button onClick={()=>{
                                    const tasks = st.plan.tasks.map(x=>(x.date===t.date&&x.type===t.type)?{...x, status:'COMPLETED'}:x);
                                    setSt({...st, streak:st.streak+1, plan:{...st.plan, tasks}});
                                }}>تم</button></div>)}
                            </>}
                            <nav className="bottomnav"><button onClick={()=>setTab('home')} className={tab==='home'?'on':''}>اليوم</button><button onClick={()=>{localStorage.clear();location.reload();}}>إعادة</button></nav>
                        </div>
                    )}
                </div>
            );
        }

        const CSS = `
            body{ --bg:#0E1726; --surface:#152139; --primary:#C9A227; --text:#EFE7D5; background:var(--bg); color:var(--text); }
            .topbar{ display:flex; justify-content:space-between; padding:20px; align-items:center; }
            .badge{ background:#1D2E4B; padding:5px 15px; border-radius:15px; border:1px solid var(--primary); text-align:center; }
            .card{ background:var(--surface); border-radius:20px; padding:20px; margin:15px; border:1px solid rgba(201,162,39,0.1); }
            .wizard{ max-width:400px; margin:0 auto; }
            .step-content{ margin:20px 0; display:flex; flex-direction:column; gap:10px; }
            select, input{ background:var(--bg); color:white; padding:12px; border:1px solid #1D2E4B; border-radius:10px; }
            .btn{ border:none; padding:12px 20px; border-radius:10px; cursor:pointer; font-weight:bold; }
            .btn.primary{ background:var(--primary); color:black; }
            .btn.ghost{ background:none; color:white; border:1px solid #1D2E4B; }
            .opt{ background:#1D2E4B; color:white; padding:15px; border-radius:12px; text-align:right; border:1px solid transparent; cursor:pointer; width:100%; }
            .opt.active{ border-color:var(--primary); background:rgba(201,162,39,0.1); }
            .error{ color:#B4574C; font-size:12px; text-align:center; }
            .task-card{ background:var(--surface); padding:15px; border-radius:15px; margin:10px; display:flex; justify-content:space-between; align-items:center; border-right:4px solid var(--primary); }
            .p-bar{ height:6px; background:#1D2E4B; border-radius:3px; margin-top:10px; overflow:hidden; }
            .p-bar i{ display:block; height:100%; background:var(--primary); transition:0.3s; }
            .bottomnav{ position:fixed; bottom:0; left:0; right:0; background:var(--surface); display:flex; padding:15px; gap:10px; }
            .bottomnav button{ flex:1; background:none; border:none; color:white; font-weight:bold; cursor:pointer; }
            .bottomnav button.on{ color:var(--primary); }
        `;
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
